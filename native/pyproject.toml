[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluke-native"
version = "0.1.0"
description = "FLUKE：PySide6 本机桌面工作台与数据迁移工具"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials==6.11.2",
    "PySide6-Addons==6.11.2",
    "tzdata==2026.4",
    "python-dateutil==2.9.0.post0",
    "tzlocal==5.4.4",
    "rawpy==0.27.1",
    "Pillow==12.3.0",
    "numpy==2.2.6; python_version < '3.12'",
    "numpy==2.5.3; python_version >= '3.12'",
    "openpyxl==3.1.5",
    "lxml==6.1.3",
    "python-docx==1.2.0",
    "markdown-it-py==4.2.0",
    "pypdf[crypto]==6.16.0",
    "pdfplumber==0.11.10",
    "winrt-Windows.Devices.Geolocation[all]==3.2.1; platform_system == 'Windows'",
]

[tool.setuptools]
py-modules = ["main", "migrate_legacy"]

[tool.setuptools.packages.find]
include = ["wanxiang*"]

[project.scripts]
fluke-import-legacy = "migrate_legacy:main"
fluke-convert = "wanxiang.converter_cli:main"

[project.optional-dependencies]
build = ["PyInstaller==6.20.0"]
